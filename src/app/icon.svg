  <path d="M 19 35 C 15 32 13 26 14 21 C 15 18 17 16 20 15" stroke="url(#wingGrad)" strokeWidth="2" strokeLinecap="round" strokeOpacity="0.75" />

  <!-- Right Wing NFC Waves -->
  <path d="M 47 40 C 53 36 56 28 54 20 C 53 16 51 13 47 11" stroke="url(#wingGrad)" strokeWidth="2.4" strokeLinecap="round" strokeOpacity="0.95" />
  <path d="M 45 35 C 49 32 51 26 50 21 C 49 18 47 16 44 15" stroke="url(#wingGrad)" strokeWidth="2" strokeLinecap="round" strokeOpacity="0.75" />

  <!-- Phoenix Crest Flame -->
  <path d="M 32 6 C 30 10 29 12 32 14 C 35 12 34 10 32 6 Z" fill="#FDE047" />
  <circle cx="32" cy="7.5" r="1.5" fill="#FFFFFF" />

