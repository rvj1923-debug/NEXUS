  <path d="M 36 34 L 30 40 M 30 40 H 34 M 30 40 V 36" stroke="url(#exGradB)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
  <circle cx="32" cy="33" r="1.8" fill="#FFFFFF" />
